apiVersion: v1
kind: Secret
metadata:
  name: beta-code-secrets
  namespace: beta-code
type: Opaque
# Values are base64-encoded. To update:
#   echo -n 'yourvalue' | base64
stringData:
  # CHANGE ME before deploying to a real server: this default matches the
  # local docker-compose password and must not be used in production.
  POSTGRES_PASSWORD: "postgres"
  # Shared secret the runner uses to authenticate against the frontend's
  # internal test-fetch API. Generate your own before deploying:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  # The frontend now refuses this endpoint entirely if this is left empty.
  RUNNER_SECRET: "9c62fb01df2f9a3c5bbe374164b64634bd67b184347e3d743e504202ac0c6052"